<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #7b8794;
      --border: #e4e7eb;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --danger: #dc2626;
      --radius: 10px;
      --gap: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 var(--gap);
      font-size: 1.6rem;
    }

    .add-form {
      display: flex;
      gap: var(--gap);
      margin-bottom: var(--gap);
    }

    .add-form input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--text);
    }

    button {
      padding: 10px 16px;
      font-size: 0.95rem;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .add-button {
      background: var(--accent);
      color: var(--accent-text);
    }

    .delete-button {
      background: transparent;
      color: var(--danger);
      padding: 6px 10px;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: var(--gap);
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .todo-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .todo-title {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .todo-item.done .todo-title {
      text-decoration: line-through;
      color: var(--muted);
    }

    .todo-item.done {
      opacity: 0.6;
    }

    .empty-message {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form class="add-form" id="add-form">
      <input type="text" id="todo-input" placeholder="What needs to be done?" aria-label="New todo title" autocomplete="off">
      <button type="submit" class="add-button">Add</button>
    </form>

    <ul class="todo-list" id="todo-list"></ul>
    <p class="empty-message" id="empty-message">Nothing to do yet</p>
  </main>

  <script>
    const todos = [];

    const form = document.getElementById("add-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const emptyMessage = document.getElementById("empty-message");

    function addTodo(title) {
      const trimmed = title.trim();
      if (trimmed === "") {
        return;
      }
      todos.push({
        id: crypto.randomUUID(),
        title: trimmed,
        done: false,
        createdAt: Date.now(),
      });
      render();
    }

    function toggleTodo(id) {
      const todo = todos.find((item) => item.id === id);
      if (todo) {
        todo.done = !todo.done;
      }
      render();
    }

    function removeTodo(id) {
      const index = todos.findIndex((item) => item.id === id);
      if (index !== -1) {
        todos.splice(index, 1);
      }
      render();
    }

    function createTodoItem(todo) {
      const item = document.createElement("li");
      item.className = todo.done ? "todo-item done" : "todo-item";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = todo.done;
      checkbox.setAttribute("aria-label", `Mark "${todo.title}" as done`);
      checkbox.addEventListener("change", () => toggleTodo(todo.id));

      const title = document.createElement("span");
      title.className = "todo-title";
      title.textContent = todo.title;

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "delete-button";
      deleteButton.textContent = "Delete";
      deleteButton.setAttribute("aria-label", `Delete "${todo.title}"`);
      deleteButton.addEventListener("click", () => removeTodo(todo.id));

      item.append(checkbox, title, deleteButton);
      return item;
    }

    function render() {
      list.replaceChildren(...todos.map(createTodoItem));
      emptyMessage.hidden = todos.length > 0;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      addTodo(input.value);
      input.value = "";
      input.focus();
    });

    render();
  </script>
</body>
</html>

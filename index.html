<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo App</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #7b8794;
      --border: #e4e7eb;
      --accent: #2563eb;
      --accent-text: #ffffff;
      --danger: #dc2626;
      --radius: 10px;
      --gap: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.4;
    }

    .app {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 var(--gap);
      font-size: 1.6rem;
    }

    .add-form {
      display: flex;
      gap: var(--gap);
      margin-bottom: var(--gap);
    }

    .add-form input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      color: var(--text);
    }

    button {
      padding: 10px 16px;
      font-size: 0.95rem;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
    }

    .add-button {
      background: var(--accent);
      color: var(--accent-text);
    }

    .delete-button {
      background: transparent;
      color: var(--danger);
      padding: 6px 10px;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: var(--gap);
      padding: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .todo-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .todo-title {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .todo-item.done .todo-title {
      text-decoration: line-through;
      color: var(--muted);
      opacity: 0.6;
    }

    .empty-message {
      text-align: center;
      color: var(--muted);
      padding: 24px 0;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: var(--gap);
      margin-top: var(--gap);
    }

    .counter {
      margin: 0;
      color: var(--muted);
    }

    .filters {
      display: flex;
      gap: 6px;
    }

    .filter-button {
      padding: 6px 10px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .filter-button[aria-pressed="true"] {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Todo</h1>

    <form class="add-form" id="add-form">
      <input type="text" id="todo-input" placeholder="What needs to be done?" aria-label="New todo title" autocomplete="off">
      <button type="submit" class="add-button">Add</button>
    </form>

    <ul class="todo-list" id="todo-list"></ul>
    <p class="empty-message" id="empty-message">Nothing to do yet</p>

    <div class="toolbar">
      <p class="counter" id="counter" aria-live="polite"></p>
      <div class="filters" role="group" aria-label="Filter todos">
        <button type="button" class="filter-button" data-filter="all" aria-pressed="true">All</button>
        <button type="button" class="filter-button" data-filter="active" aria-pressed="false">Active</button>
        <button type="button" class="filter-button" data-filter="completed" aria-pressed="false">Completed</button>
      </div>
    </div>
  </main>

  <script>
    const todos = [];

    const form = document.getElementById("add-form");
    const input = document.getElementById("todo-input");
    const list = document.getElementById("todo-list");
    const emptyMessage = document.getElementById("empty-message");
    const counter = document.getElementById("counter");
    const filterButtons = document.querySelectorAll("[data-filter]");
    const emptyTexts = {
      all: "Nothing to do yet",
      active: "No active todos",
      completed: "No completed todos",
    };
    let currentFilter = "all";

    function createId() {
      // crypto.randomUUID() exists only in secure contexts (https or localhost).
      if (crypto.randomUUID) {
        return crypto.randomUUID();
      }
      return `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function addTodo(title) {
      const trimmed = title.trim();
      if (trimmed === "") {
        return false;
      }
      todos.push({
        id: createId(),
        title: trimmed,
        done: false,
        createdAt: Date.now(),
      });
      render();
      return true;
    }

    function toggleTodo(id) {
      const todo = todos.find((item) => item.id === id);
      if (todo) {
        todo.done = !todo.done;
      }
      render();
    }

    function removeTodo(id) {
      const index = todos.findIndex((item) => item.id === id);
      if (index !== -1) {
        todos.splice(index, 1);
      }
      render();
    }

    function createTodoItem(todo) {
      const item = document.createElement("li");
      item.className = todo.done ? "todo-item done" : "todo-item";
      item.dataset.id = todo.id;

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = todo.done;
      checkbox.setAttribute("aria-label", `Mark "${todo.title}" as done`);
      checkbox.addEventListener("change", () => {
        toggleTodo(todo.id);
        // render() rebuilds the list, so keep keyboard focus on the new checkbox.
        // The filter may hide the todo now, so fall back to the input.
        const checkboxAgain = list.querySelector(`[data-id="${todo.id}"] input[type="checkbox"]`);
        (checkboxAgain ?? input).focus();
      });

      const title = document.createElement("span");
      title.className = "todo-title";
      title.textContent = todo.title;

      const deleteButton = document.createElement("button");
      deleteButton.type = "button";
      deleteButton.className = "delete-button";
      deleteButton.textContent = "Delete";
      deleteButton.setAttribute("aria-label", `Delete "${todo.title}"`);
      deleteButton.addEventListener("click", () => {
        removeTodo(todo.id);
        // The deleted button is gone after render(), so move focus to the input.
        input.focus();
      });

      item.append(checkbox, title, deleteButton);
      return item;
    }

    function visibleTodos() {
      if (currentFilter === "active") {
        return todos.filter((todo) => !todo.done);
      }
      if (currentFilter === "completed") {
        return todos.filter((todo) => todo.done);
      }
      return todos;
    }

    function setFilter(filter) {
      currentFilter = filter;
      render();
    }

    function renderFilterButtons() {
      filterButtons.forEach((button) => {
        button.setAttribute("aria-pressed", String(button.dataset.filter === currentFilter));
      });
    }

    function renderCounter() {
      const left = todos.filter((todo) => !todo.done).length;
      counter.textContent = `${left} ${left === 1 ? "item" : "items"} left`;
    }

    function render() {
      const visible = visibleTodos();
      list.replaceChildren(...visible.map(createTodoItem));
      emptyMessage.textContent = emptyTexts[currentFilter];
      emptyMessage.hidden = visible.length > 0;
      renderFilterButtons();
      renderCounter();
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (addTodo(input.value)) {
        input.value = "";
      }
      input.focus();
    });

    filterButtons.forEach((button) => {
      button.addEventListener("click", () => setFilter(button.dataset.filter));
    });

    render();
  </script>
</body>
</html>
